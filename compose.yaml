name: eazyshop-local
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    restart: unless-stopped
    env_file: .env.postgres
    ports:
      - "127.0.0.1:${EAZYSHOP_POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 PGDATA is /var/lib/postgresql/18/docker.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-eazyshop.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eazyshop_bootstrap -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 128mb
volumes:
  postgres_data:
